name: Java CI with Maven (Linux)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      workdir: com.riccardo.shop
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    strategy:
      matrix:
        java: [17, 21]

    name: Build with Java ${{ matrix.java }} on Linux
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2
          ~/.sonar/cache
        key: ${{ runner.os }}-m2-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml', '**/*.yml') }}
        restore-keys: ${{ runner.os }}-m2-

    - name: Set Maven Additional Options
      run: |
        echo "ADDITIONAL_MAVEN_OPTIONS=-Pcoveralls" >> $GITHUB_ENV
      if: ${{ env.COVERALLS_REPO_TOKEN && matrix.java == 17 }}

    - name: Set Maven Additional Goals
      run: |
        echo "JACOCO_OPTION=-Pjacoco" >> $GITHUB_ENV
        echo "SONARGOAL=sonar:sonar" >> $GITHUB_ENV
      if: ${{ env.SONAR_TOKEN && matrix.java == 17 }}

    - name: Build with Maven and SonarCloud
      run: >
        mvn verify $JACOCO_OPTION $ADDITIONAL_MAVEN_OPTIONS $SONARGOAL
        -Dsonar.organization=riccardo-giannuzzi
        -Dsonar.host.url=https://sonarcloud.io
        -Dsonar.projectKey=Riccardo-Giannuzzi_shop-manager
      working-directory: ${{ env.workdir }}

    - name: Generate JUnit Report
      run: >
        mvn surefire-report:report-only
      working-directory: ${{ env.workdir }}
      if: ${{ always() }}

    - name: Archive JUnit Report
      uses: actions/upload-artifact@v6
      if: ${{ always() }}
      with:
        name: surefire-report-jdk-${{ matrix.java }}
        path: '**/target/reports'