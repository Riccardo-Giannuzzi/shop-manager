services:
  mongodb:
    image: mongo:5
    container_name: mongodb
    restart: "no"
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  mongo-data: